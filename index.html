<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>维基百科中文历史条目库</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
<div id="app">
  <header>
    <div class="header-bar">
      <h1>📚 维基历史条目库</h1>
      <div class="search-wrap">
        <input type="search" id="search" placeholder="搜索条目..." autocomplete="off" autofocus>
        <span id="count"></span>
      </div>
    </div>
  </header>
  <main>
    <aside id="sidebar">
      <div id="list"></div>
    </aside>
    <section id="content">
      <div id="welcome">
        <h2>维基百科中文历史条目库</h2>
        <p>共 <strong id="total-count">—</strong> 条目，其中 <strong id="article-count">—</strong> 篇正文</p>
        <p>点击左侧条目或使用搜索查找内容</p>
      </div>
      <article id="article" style="display:none"></article>
    </section>
  </main>
</div>
<script src="app.js"></script>
</body>
</html>
