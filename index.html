<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<title>维基历史条目库</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>

<!-- 首页视图 -->
<div id="home-view">
  <div class="home-center">
    <div class="home-logo">📚</div>
    <h1>维基历史条目库</h1>
    <p class="home-sub">简体中文 · 31,884 条目</p>
    <div class="search-box">
      <input type="search" id="home-search" placeholder="搜索条目…" autocomplete="off">
      <div id="search-results" class="search-results"></div>
    </div>
    <div class="home-actions">
      <button onclick="randomArticle()">🎲 随机条目</button>
    </div>
  </div>
</div>

<!-- 文章视图 -->
<div id="article-view" style="display:none">
  <header class="article-header">
    <button class="back-btn" onclick="goHome()">← 返回</button>
    <input type="search" id="article-search" placeholder="搜索…" autocomplete="off">
    <div id="article-search-results" class="search-results"></div>
  </header>
  <div class="article-wrap">
    <article id="article-content"></article>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
